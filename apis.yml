name: Brick&Bolt
description: 'Brick&Bolt (bricknbolt.com) is a Bangalore-based, tech-enabled home and commercial
  construction marketplace that delivers end-to-end design-to-build services across major
  Indian cities including Bangalore, Hyderabad, Chennai, Delhi NCR, and Mysuru. The company
  connects homeowners with vetted contractors and manages projects through its QASCON quality
  system (470+ quality checks), an ESCROW-secured payment model that releases funds only as
  milestones complete, transparent quotations, and consumer and professional mobile apps for
  real-time project tracking. Backed by Accel, Brick&Bolt has delivered thousands of homes and
  was named to Forbes Asia''s "100 to Watch" list. This profile was surfaced as an Accel
  portfolio company and enriched by the API Evangelist pipeline; Brick&Bolt operates a consumer
  construction platform and mobile apps but publishes no public developer API, OpenAPI, or
  developer portal at this time.'
